{% extends 'backend/base.html' %}

{% load static %}

{% block content %}

<main class="main-content">
    <div class="container-fluid">
        <h1 class="animate__animated animate__fadeInDown mb-4">Bienvenue sur le Dashboard</h1>
        <div class="row g-4">
            <div class="col-12 col-sm-12 col-xl-6">
                <div class="dashboard-card p-4 animate__animated animate__fadeInUp">
                    <div class="d-flex align-items-center mb-3">
                        <div class="icon-circle rounded-circle me-3">
                            <i class="fas fa-users text-success h3"></i>
                        </div>
                        <h5 class="mb-0">Utilisateurs sur le site</h5>
                    </div>
                    <h2 class="text-primary">1,234</h2>
                    <div class="progress mt-3">
                        <div class="progress-bar bg-primary progress-bar-striped" style="width: 75%"></div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-12 col-xl-6">
                <div class="dashboard-card p-4 animate__animated animate__fadeInUp">
                    <div class="d-flex align-items-center mb-3">
                        <div class="icon-circle  me-3">
                            <i class="fas fa-users text-success h3"></i>
                        </div>
                        <h5 class="mb-0">Enseigants sur le site </h5>
                    </div>
                    <h2 class="text-primary">1,234</h2>
                    <div class="progress mt-3">
                        <div class="progress-bar bg-primary progress-bar-striped" style="width: 75%"></div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-12 col-xl-6">
                <div class="dashboard-card p-4 animate__animated animate__fadeInUp">
                    <div class="d-flex align-items-center mb-3">
                        <div class="icon-circle me-3">
                            <i class="fas fa-chalkboard-teacher text-success h3"></i>
                        </div>
                        <h5 class="mb-0">Nombre de cours actuels</h5>
                    </div>
                    <h2 class="text-primary">1,234</h2>
                    <div class="progress mt-3">
                        <div class="progress-bar bg-primary progress-bar-striped" style="width: 75%"></div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-12 col-xl-6">
                <div class="dashboard-card p-4 animate__animated animate__fadeInUp">
                    <div class="d-flex align-items-center mb-3">
                        <div class="icon-circle  me-3">
                            <i class="fas fa-clipboard-list text-success h3"></i>
                        </div>
                        <h5 class="mb-0">Nombre d'epreuves actuels</h5>
                    </div>
                    <h2 class="text-primary">1,234</h2>
                    <div class="progress mt-3">
                        <div class="progress-bar bg-primary progress-bar-striped" style="width: 75%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Graphique -->
        <div class="chart-container mt-4">
            <canvas id="performanceChart"></canvas>
        </div>
    </div>
</main>

{% endblock %}
